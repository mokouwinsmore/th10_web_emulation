<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>东方风神录 ～ Mountain of Faith</title>
<style>html,body{margin:0;background:#080c08;color:#d4dccb;font:14px system-ui}body{min-height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}canvas{width:min(960px,96vw,calc((100dvh - 160px)*4/3));height:auto;aspect-ratio:4/3;background:#000;outline:none}canvas:fullscreen{width:100vw;height:100vh;object-fit:contain}nav{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}button,select,input{font:inherit}button,select{padding:8px 18px;border:1px solid #596b44;background:#1e2c19;color:#e5eddc;border-radius:3px;cursor:pointer}button:disabled{opacity:.5;cursor:default}p{margin:0;white-space:pre-wrap}details{max-width:90vw;color:#b3bda6}details p{margin:12px 0;line-height:1.7}#status{font-variant-numeric:tabular-nums;max-width:90vw;max-height:120px;overflow:auto}</style></head><body>
<canvas id="screen" width="640" height="480" tabindex="0" aria-label="东方风神录游戏画面"></canvas>
<nav><select id="language" aria-label="游戏语言"><option value="jp">日文原版</option><option value="chs">简体汉化版</option></select><button id="start">开始游戏</button><button id="fullscreen">全屏</button><button id="quit" disabled>退出并保存</button><span>方向键移动 · Z 射击 / 确认 · Shift 低速 · X 灵击 / 返回 · Esc 暂停</span></nav>
<p id="status" role="status">东方风神录 日文版 1.00a · 点击开始游戏</p>
<details><summary>存档、录像与操作说明</summary><p>Ctrl 快进对话。音量和按键在游戏 Option 中调整。支持手柄，请先按任意按钮识别设备。
日文与简体版分别保存进度。结束时点击“退出并保存”，或从游戏菜单选择 Quit，等待退出后再关闭页面。
进度保存在当前浏览器、当前网址。更换电脑或端口前，请导出备份，在新环境中选择相同语言后导入。也可导入原版 scoreth10.dat、汉化版 scoreth10c.dat 和 .rpy 录像。</p><nav><button id="export">导出存档备份</button><label>导入 <input id="import" type="file" accept=".rpy,.dat,.cfg,.json" multiple></label></nav></details>
<script type="module" src="/runtime/browser-main.mjs"></script></body></html>
